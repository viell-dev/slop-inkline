name: Bug report
description:
  Report a symbol that draws, saves, or shows wrongly, a crash, or another
  defect
labels: ["Type: Bug"]
body:
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: >-
        What went wrong, in your own words. A sentence is enough. Leave private
        notes and drawings out.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >-
        Optional. What you did before it happened, from a new vault or note if
        you can, with any theme or other plugin it needs.
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Optional. What you expected to happen instead.
  - type: textarea
    id: environment
    attributes:
      label: Versions
      description: >-
        Optional. The Inkline version, the Obsidian version and installer
        version (both in Settings, General), the operating system, and what
        you draw with: a mouse, a trackpad, or another pointer.
  - type: textarea
    id: evidence
    attributes:
      label: Messages and files
      description: >-
        Optional. Any error notice, a message from the developer console (View,
        Toggle developer tools), a screenshot, or a `.ink.png` file that shows
        the problem, if it holds nothing private.
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of conduct
      options:
        - label: I follow the project's [code of
            conduct](https://github.com/viell-dev/slop-inkline/blob/main/CODE_OF_CONDUCT.md).
          required: true
