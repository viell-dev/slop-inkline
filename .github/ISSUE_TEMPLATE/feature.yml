name: Feature request
description: Propose a new capability or a change to how Inkline works
labels: ["Type: Feature Request"]
body:
  - type: textarea
    id: request
    attributes:
      label: What you want
      description: >-
        What you would like Inkline to do, in your own words. A sentence is
        enough.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: What it would help with
      description: >-
        Optional. The notes and symbols you would use it for, what you do now,
        or another tool that already does it. Anything here helps weigh the
        request.
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of conduct
      options:
        - label: I follow the project's [code of
            conduct](https://github.com/viell-dev/slop-inkline/blob/main/CODE_OF_CONDUCT.md).
          required: true
