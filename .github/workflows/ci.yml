name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that a new public Obsidian release is tested within a week.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # The ruleset requires these names; keep them stable.
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # From 1.0.0, test/fixtures/pinned.sha256 only grows, as AGENTS.md says:
      # every line it had in a release must still be in it. The release tags
      # are what it is compared with, as the ruleset makes them immutable. The
      # checkout is shallow and has no tags, and the repository is public, so
      # fetching them needs no credentials. Linux only: the check reads Git,
      # which is the same on both systems.
      - name: Fetch the release tags
        if: runner.os == 'Linux'
        run: git fetch --no-tags --depth=1 origin '+refs/tags/*:refs/tags/*'
      - name: Check that the pinned list only grows
        if: runner.os == 'Linux'
        run: npm run check:pinned
      - run: npm run check
      # Audits what ships: the bundled runtime dependencies. The development
      # tools' advisories are tracked by Dependabot's alerts and issue #10,
      # so that one published tomorrow does not fail unrelated pull requests.
      - if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=low

  # The end-to-end suite, split over shards that run side by side, each on
  # every Obsidian version. test/e2e/wdio.conf.mts balances them by the
  # seconds in test/e2e/weights.json. The job `e2e` below reports the outcome
  # under the name the ruleset requires, so no shard's name may be `e2e`.
  e2e-shard:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        # The number of shards is this list's length, which E2E_SHARD and the
        # name read as strategy.job-total. The e2e job fails if the shards
        # together miss or repeat a spec file.
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    # The unsharded suite took 28 to 30 minutes on main by 2026-11-16; a shard
    # should take about 8.5. A limit is a hang's ceiling, not a target.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Resolve the Obsidian versions
        env:
          PRINT_OBSIDIAN_CACHE_KEY: "1"
        run: |
          node test/e2e/wdio.conf.mts | grep '^obsidian-cache-key:' > obsidian-versions.txt
          cat obsidian-versions.txt
          rm -rf .obsidian-cache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .obsidian-cache
          key: obsidian-${{ runner.os }}-${{ hashFiles('obsidian-versions.txt') }}
      - name: Install the virtual display, test fonts, and PDF tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -q --yes --no-install-recommends fonts-dejavu-core herbstluftwm poppler-utils x11-xserver-utils xvfb
      - run: sh test/e2e/session.sh
        env:
          E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      # Only after the tests passed: that this execution wrote its own record,
      # for exactly this shard's spec files, each passed on every version. A
      # re-run that tested nothing then fails here, rather than leaving e2e an
      # earlier attempt's record as this shard's latest.
      - name: Check that this shard ran and passed its spec files
        env:
          E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: node test/e2e/shards.ts shard "$E2E_SHARD" test-results/e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # A re-run of a shard uploads beside its earlier attempts' artifacts,
          # which stay in the run, and the download below would put artifacts
          # of one name in one directory, where either attempt's record could
          # win. With the attempt in the name, each lands in a directory of its
          # own, and the check reads each shard's latest.
          name: e2e-results-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: test-results/e2e
          # A shard that failed before its output existed fails here too; the
          # job has failed either way.
          if-no-files-found: error
          retention-days: 30

  # The check the ruleset and the release check require. It passes only when
  # every shard passed and the shards' records together show every spec file
  # in test/e2e/specs run exactly once and passed on each of the default
  # Obsidian versions, with every launcher's exit code 0, so that it does not
  # rest on the shards' results alone, which a partial re-run can change. GitHub
  # counts a skipped required job as passing, so this job must never be
  # skippable: `always()` runs it after a failed or cancelled shard too, and
  # its first step then fails.
  e2e:
    name: e2e
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check that every shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "The shards ended: $SHARDS"
          test "$SHARDS" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-results-*
          path: e2e-shards
          # Each artifact in a directory named after it, as the check reads
          # the attempt from that name.
          merge-multiple: false
      # Node.js's own modules only, so no npm ci. Of a shard that ran more
      # than once, it reads only the latest attempt's record.
      - name: Check that the shards ran every spec file
        run: node test/e2e/shards.ts check e2e-shards

  # The image the owner and agents run locally with `npm run test:e2e:docker`.
  # Weekly and on request, so that it keeps working without slowing every pull
  # request.
  e2e-docker:
    name: e2e in Docker
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The same suite, with the image's build before it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm run test:e2e:docker
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-docker-results
          path: test-results/e2e
          if-no-files-found: warn
          retention-days: 30
