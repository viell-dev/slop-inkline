name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that a new public Obsidian release is tested within a week.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The end-to-end suite, split over shards that run side by side, each on
  # every Obsidian version. test/e2e/wdio.conf.mts balances them by the
  # seconds in test/e2e/weights.json. The job `e2e` below reports the outcome
  # under the name the ruleset requires, so no shard's name may be `e2e`.
  e2e-shard:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        # The number of shards is this list's length, which E2E_SHARD and the
        # name read as strategy.job-total. The e2e job fails if the shards
        # together miss or repeat a spec file.
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    # The unsharded suite took 28 to 30 minutes on main by 2026-11-16; a shard
    # should take about 8.5. A limit is a hang's ceiling, not a target.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # PROBE ONLY, not for merge: writes this shard's record in the real
      # format from the real assignment, failing shards 2 and 3 in attempt 1.
      - name: Write a probe record
        env:
          E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          sleep 45
          mkdir -p test-results/e2e
          node --input-type=module <<'PROBE'
          import { writeFileSync } from "node:fs";
          import * as h from "./test/e2e/support/harness.ts";
          const shard = h.parseShard(process.env.E2E_SHARD);
          const specs = await h.specFiles("test/e2e/specs");
          const weights = await h.readWeights("test/e2e/weights.json");
          const mine = h.assignShards(specs, weights, shard.total)[shard.index - 1];
          const fail = process.env.GITHUB_RUN_ATTEMPT === "1" && [2, 3].includes(shard.index);
          const record = {
            format: h.durationsFormat,
            shard: process.env.E2E_SHARD,
            versions: [...h.defaultObsidianVersions],
            exitCode: fail ? 1 : 0,
            specs: Object.fromEntries(mine.map((spec, i) => [spec, Object.fromEntries(
              h.defaultObsidianVersions.map((v) => [v, { resolved: v, seconds: 1, exitCode: fail && i === 0 ? 1 : 0 }]))])),
          };
          writeFileSync("test-results/e2e/durations.json", JSON.stringify(record, null, 2));
          console.log(`attempt ${process.env.GITHUB_RUN_ATTEMPT}, shard ${process.env.E2E_SHARD}, ${mine.length} specs, fail: ${fail}`);
          process.exit(fail ? 1 : 0);
          PROBE
      # Only after the tests passed: that this execution wrote its own record,
      # for exactly this shard's spec files, each passed on every version. A
      # re-run that tested nothing then fails here, rather than leaving an
      # earlier attempt's artifact as the newest of its name for e2e to read.
      - name: Check that this shard ran and passed its spec files
        env:
          E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: node test/e2e/shards.ts shard "$E2E_SHARD" test-results/e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Artifact names must be unique within a run.
          name: e2e-results-${{ matrix.shard }}
          path: test-results/e2e
          # A shard that failed before its output existed fails here too; the
          # job has failed either way.
          if-no-files-found: error
          retention-days: 30

  # The check the ruleset and the release check require. It passes only when
  # every shard passed and the shards' records together show every spec file
  # in test/e2e/specs run exactly once and passed on each of the default
  # Obsidian versions, with every launcher's exit code 0, so that it does not
  # rest on the shards' results alone, which a partial re-run can change. GitHub
  # counts a skipped required job as passing, so this job must never be
  # skippable: `always()` runs it after a failed or cancelled shard too, and
  # its first step then fails.
  e2e:
    name: e2e
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check that every shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "The shards ended: $SHARDS"
          test "$SHARDS" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-results-*
          path: e2e-shards
      # Node.js's own modules only, so no npm ci.
      - name: Check that the shards ran every spec file
        run: node test/e2e/shards.ts check e2e-shards
